<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <link rel="stylesheet" href="./newtab.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <nav aria-label="Sections" class="nav">
          <ul class="pill-nav glass-card">
            <li><a class="pill-nav__item" href="#countdown" aria-current="page">Countdown</a></li>
            <li>
              <button type="button" class="pill-nav__item" id="modules-toggle" aria-expanded="false" aria-controls="modules-menu">
                Modules<svg class="pill-nav__chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
            </li>
            <li>
              <a class="pill-nav__item" aria-disabled="true" title="Pomodoro timer, coming later">
                Focus<span class="pill-nav__soon">Soon</span>
              </a>
            </li>
          </ul>
          <div id="modules-menu" class="modules-menu glass-card" hidden>
            <ul id="modules-menu-list" class="modules-menu__list"></ul>
          </div>
        </nav>
        <a class="gear glass-card" href="../options/index.html" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </a>
      </div>
    </header>

    <main class="stage">
      <!-- Decorative: pixel-art TUM campus; the picture is picked per season in main.ts. -->
      <div class="hero" aria-hidden="true">
        <div class="hero__layer hero__layer--48"></div>
        <div class="hero__layer hero__layer--96"></div>
        <div class="hero__layer hero__layer--full"></div>
        <div class="hero__overlay"></div>
      </div>
      <div class="stage__content">
        <div id="view-countdown" class="view">
          <section class="countdown" aria-labelledby="headline">
            <p class="countdown__eyebrow">Exam countdown</p>
            <h1 id="headline" class="countdown__title">&nbsp;</h1>
            <p id="detail" class="countdown__detail"></p>
          </section>

          <section class="exams" aria-labelledby="exams-title">
            <h2 id="exams-title" class="visually-hidden">All exams</h2>
            <ul id="exam-grid" class="exam-grid exam-grid--columns"></ul>
            <details id="done-section" class="done-list" hidden>
              <summary class="done-list__summary">Done (<span id="done-count">0</span>)</summary>
              <ul id="done-grid" class="exam-grid"></ul>
            </details>
          </section>
        </div>

        <div id="view-module" class="view" hidden></div>

        <div id="view-general" class="view" hidden>
          <section class="general" aria-labelledby="general-title">
            <h1 id="general-title" class="countdown__title general__title" tabindex="-1">General links</h1>
            <p class="general__intro">Portals and links that aren't tied to one module. Module links live on each module's page.</p>
            <div id="general-groups" class="general__groups"></div>
          </section>
        </div>
      </div>
    </main>
    <dialog id="exam-detail" class="detail glass-card" aria-labelledby="detail-title">
      <div class="detail__inner">
        <form method="dialog">
          <button class="detail__close" aria-label="Close">✕</button>
        </form>
        <div class="detail__body"></div>
        <a class="detail__edit" id="detail-edit" href="../options/index.html">Edit in settings</a>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
