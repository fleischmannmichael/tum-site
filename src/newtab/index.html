<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <link rel="stylesheet" href="./newtab.css" />
  </head>
  <body>
    <main>
      <section class="countdown" aria-labelledby="headline">
        <h1 id="headline"></h1>
        <p id="days" class="days"></p>
        <p id="detail" class="detail"></p>
      </section>

      <section aria-labelledby="upcoming-title">
        <h2 id="upcoming-title">Upcoming exams</h2>
        <ul id="upcoming"></ul>
      </section>

      <details id="done-section" hidden>
        <summary>Done (<span id="done-count">0</span>)</summary>
        <ul id="done"></ul>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
