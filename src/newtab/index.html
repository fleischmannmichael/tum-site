<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>New Tab</title>
    <link rel="preload" href="/hero/hero-48.png" as="image" />
    <link rel="preload" href="/hero/hero-96.png" as="image" />
    <link rel="preload" href="/hero/hero-384.png" as="image" />
    <link rel="stylesheet" href="./newtab.css" />
  </head>
  <body>
    <!-- Decorative: pixel-art TUM campus at dusk. -->
    <div class="hero" aria-hidden="true">
      <div class="hero__layer hero__layer--48"></div>
      <div class="hero__layer hero__layer--96"></div>
      <div class="hero__layer hero__layer--384"></div>
      <div class="hero__overlay"></div>
    </div>

    <div class="page">
      <header class="topbar">
        <nav aria-label="Sections">
          <ul class="pill-nav glass-card">
            <li><a class="pill-nav__item" href="#countdown" aria-current="page">Countdown</a></li>
            <li><a class="pill-nav__item" href="#resources">Resources</a></li>
            <li>
              <a class="pill-nav__item" aria-disabled="true" title="Coming later">
                Focus<span class="pill-nav__soon">Soon</span>
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <main>
        <div id="view-countdown" class="view">
          <section class="countdown" aria-labelledby="headline">
            <p id="eyebrow" class="countdown__eyebrow"></p>
            <h1 id="headline" class="countdown__title">&nbsp;</h1>
            <p id="days" class="countdown__days"></p>
            <p id="detail" class="countdown__detail"></p>
          </section>

          <section class="exams" aria-labelledby="exams-title">
            <h2 id="exams-title" class="visually-hidden">All exams</h2>
            <ul id="exam-grid" class="exam-grid"></ul>
            <details id="done-section" class="done-list" hidden>
              <summary class="done-list__summary">Done (<span id="done-count">0</span>)</summary>
              <ul id="done-grid" class="exam-grid"></ul>
            </details>
          </section>
        </div>

        <div id="view-resources" class="view" hidden>
          <section class="glass-card placeholder" aria-labelledby="resources-title">
            <h1 id="resources-title" class="placeholder__title">Resources</h1>
            <p class="placeholder__text">Study links arrive in M5.</p>
          </section>
        </div>
      </main>
    </div>
    <dialog id="exam-detail" class="detail glass-card" aria-labelledby="detail-title">
      <div class="detail__inner">
        <form method="dialog">
          <button class="detail__close" aria-label="Close">✕</button>
        </form>
        <div class="detail__body"></div>
        <p class="detail__hint">Details are editable once the settings page lands (M4).</p>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
